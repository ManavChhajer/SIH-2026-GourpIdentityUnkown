<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a9a5b"/>
      <stop offset="50%" stop-color="#a3b06a"/>
      <stop offset="100%" stop-color="#7c8f4f"/>
    </linearGradient>
    <pattern id="furrows" width="14" height="14" patternTransform="rotate(18)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#6b7a3f" stroke-width="1.4" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- base terrain -->
  <rect width="600" height="420" fill="url(#field)"/>
  <rect width="600" height="420" fill="url(#furrows)"/>

  <!-- irregular plots -->
  <polygon points="30,40 220,20 260,150 120,190 40,140" fill="#9caf6e" stroke="#5a6a38" stroke-width="2" opacity="0.55"/>
  <polygon points="280,30 480,60 470,200 320,220" fill="#b3c17d" stroke="#5a6a38" stroke-width="2" opacity="0.5"/>
  <polygon points="60,220 260,240 240,390 50,380" fill="#a8b873" stroke="#5a6a38" stroke-width="2" opacity="0.55"/>
  <polygon points="300,240 520,260 540,400 320,400" fill="#9caf6e" stroke="#5a6a38" stroke-width="2" opacity="0.5"/>

  <!-- khata number labels (plot markers) -->
  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <rect x="98" y="90" width="72" height="34" rx="4" fill="#fffef2" stroke="#5a6a38" stroke-width="1" opacity="0.92"/>
    <text x="134" y="103" font-size="10" fill="#3a2f1c">PLOT A</text>
    <text x="134" y="116" font-size="10" fill="#7a1f1f">213/A</text>

    <rect x="351" y="110" width="72" height="34" rx="4" fill="#fffef2" stroke="#5a6a38" stroke-width="1" opacity="0.92"/>
    <text x="387" y="123" font-size="10" fill="#3a2f1c">PLOT B</text>
    <text x="387" y="136" font-size="10" fill="#7a1f1f">88/C</text>

    <rect x="116" y="290" width="72" height="34" rx="4" fill="#fffef2" stroke="#5a6a38" stroke-width="1" opacity="0.92"/>
    <text x="152" y="303" font-size="10" fill="#3a2f1c">PLOT C</text>
    <text x="152" y="316" font-size="10" fill="#7a1f1f">347</text>

    <rect x="384" y="308" width="72" height="34" rx="4" fill="#fffef2" stroke="#5a6a38" stroke-width="1" opacity="0.92"/>
    <text x="420" y="321" font-size="10" fill="#3a2f1c">PLOT D</text>
    <text x="420" y="334" font-size="10" fill="#7a1f1f">560/F</text>
  </g>

  <!-- dirt roads -->
  <path d="M0,205 L600,215" stroke="#c9b88a" stroke-width="10" opacity="0.8"/>
  <path d="M270,0 L285,420" stroke="#c9b88a" stroke-width="8" opacity="0.8"/>

  <!-- water body -->
  <ellipse cx="500" cy="120" rx="55" ry="30" fill="#5b8fae" opacity="0.7"/>

  <!-- structures (small buildings) -->
  <rect x="95" y="80" width="18" height="14" fill="#7a5a45" stroke="#4a3527" stroke-width="1"/>
  <rect x="350" y="300" width="22" height="16" fill="#7a5a45" stroke="#4a3527" stroke-width="1"/>
  <rect x="180" y="290" width="16" height="12" fill="#7a5a45" stroke="#4a3527" stroke-width="1"/>

  <!-- survey markers -->
  <circle cx="120" cy="190" r="3" fill="#d64545"/>
  <circle cx="260" cy="150" r="3" fill="#d64545"/>
  <circle cx="470" cy="200" r="3" fill="#d64545"/>

  <text x="12" y="410" font-family="monospace" font-size="11" fill="#2f3a1a" opacity="0.7">SATELLITE VIEW — PLACEHOLDER — SURVEY NO. 17-B</text>
</svg>
