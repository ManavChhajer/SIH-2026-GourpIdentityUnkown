<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Minimal Mono — Land Record Digitizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #111; line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 100px 24px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
  .sub { color: #777; font-size: 14px; margin-bottom: 64px; }
  .accent { color: #0057ff; }
  .section { display: none; }
  .section.active { display: block; }
  .upload-box { border: 1px solid #eaeaea; padding: 48px 24px; text-align: center; }
  .btn { background: #111; color: #fff; border: none; padding: 10px 20px; font-size: 13px; cursor: pointer; letter-spacing: 0.02em; }
  .btn:hover { background: #0057ff; }
  .btn.ghost { background: none; color: #111; border: 1px solid #ddd; margin-top: 32px; }
  .spinner { width: 18px; height: 18px; border: 2px solid #eee; border-top-color: #0057ff; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .proc-text { font-size: 13px; color: #777; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-bottom: 1px solid #f2f2f2; }
  .row:last-child { border-bottom: none; }
  .label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.04em; }
  .value { font-size: 14px; font-weight: 500; }
  .bar-wrap { width: 60px; height: 2px; background: #eee; margin-top: 6px; }
  .bar { height: 2px; background: #0057ff; }
  .conf { font-size: 11px; color: #999; text-align: right; }
  .banner { font-size: 13px; color: #b45309; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #f2f2f2; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Land Record <span class="accent">Digitizer</span></h1>
  <p class="sub">Upload a scan. Extract fields. Review confidence.</p>

  <div id="idle" class="section active">
    <div class="upload-box">
      <p style="font-size:13px;color:#999;margin-bottom:20px;">Drop a khata/khasra scan, or</p>
      <button class="btn" onclick="showState('processing')">Choose file</button>
    </div>
  </div>

  <div id="processing" class="section">
    <div class="upload-box">
      <div class="spinner"></div>
      <p class="proc-text">Extracting fields…</p>
    </div>
  </div>

  <div id="results" class="section">
    <div class="banner" id="banner" style="display:none;">Needs review — low-confidence fields flagged below.</div>
    <div class="row"><div class="label">Khata No.</div><div style="text-align:right"><div class="value">213/A</div><div class="bar-wrap"><div class="bar" style="width:94%"></div></div></div></div>
    <div class="row"><div class="label">Khasra No.</div><div style="text-align:right"><div class="value">402</div><div class="bar-wrap"><div class="bar" style="width:88%"></div></div></div></div>
    <div class="row"><div class="label">Survey No.</div><div style="text-align:right"><div class="value">17-B</div><div class="bar-wrap"><div class="bar" style="width:61%;background:#e0a800"></div></div></div></div>
    <div class="row"><div class="label">Owner Name</div><div style="text-align:right"><div class="value">R. Venkataiah</div><div class="bar-wrap"><div class="bar" style="width:97%"></div></div></div></div>
    <div class="row"><div class="label">Area (acres)</div><div style="text-align:right"><div class="value">2.35</div><div class="bar-wrap"><div class="bar" style="width:72%"></div></div></div></div>
    <div class="row"><div class="label">Mutation</div><div style="text-align:right"><div class="value">Pending</div><div class="bar-wrap"><div class="bar" style="width:55%;background:#e0453d"></div></div></div></div>
    <button class="btn ghost" onclick="reset()">Upload another</button>
  </div>
</div>
<script>
  function showState(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'processing') {
      setTimeout(() => { showState('results'); document.getElementById('banner').style.display = 'block'; }, 1400);
    }
  }
  function reset() { showState('idle'); }
</script>
</body>
</html>
